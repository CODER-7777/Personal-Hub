name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger workflow on tags matching v*, e.g., v1.0.0

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install Root Dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck and run regression tests
        run: |
          npm run lint
          npm test

  build-desktop:
    name: Build Desktop on ${{ matrix.os }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Electron Dependencies
        run: npm ci --legacy-peer-deps
        working-directory: electron

      - name: Install Linux Dependencies (Ubuntu Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - name: Build Windows App
        if: matrix.os == 'windows-latest'
        run: npm run build:windows

      - name: Build Linux App
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux

      - name: Upload desktop build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.os }}
          path: |
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.deb

  build-android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Root Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web & Sync to Android
        run: npm run build:android

      - name: Build APK with Gradle
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: android/app/build/outputs/apk/debug/*.apk

  publish:
    name: Publish release notes
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Publish written release notes
        uses: softprops/action-gh-release@v3
        with:
          name: Personal Hub ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md

  upload-release-assets:
    name: Attach native downloads
    runs-on: ubuntu-latest
    needs: [publish, build-desktop, build-android]
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload assets to the existing release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
