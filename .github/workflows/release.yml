name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger workflow on tags matching v*, e.g., v1.0.0

permissions:
  contents: write # Needed to create a GitHub Release

jobs:
  build-desktop:
    name: Build Desktop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm install --legacy-peer-deps || (sleep 10 && npm install --legacy-peer-deps --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000)

      - name: Install Electron Dependencies
        run: npm install --legacy-peer-deps || (sleep 10 && npm install --legacy-peer-deps --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000)
        working-directory: electron

      - name: Install Linux Dependencies (Ubuntu Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - name: Build Windows App
        if: matrix.os == 'windows-latest'
        run: npm run build:windows

      - name: Build Linux App
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux

      - name: Upload desktop build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts-${{ matrix.os }}
          path: |
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.deb

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Root Dependencies
        run: npm install --legacy-peer-deps || (sleep 10 && npm install --legacy-peer-deps --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000)

      - name: Build Web & Sync to Android
        run: npm run build:android

      - name: Build APK with Gradle
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: android/app/build/outputs/apk/debug/*.apk

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-android]
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files (debug)
        run: ls -R artifacts

      - name: Create / Update GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
