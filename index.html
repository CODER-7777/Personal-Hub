<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>Personal Hub</title>
  </head>
  <body>
    <div id="error-container" style="color: red; position: fixed; top: 0; left: 0; z-index: 9999; background: white; padding: 20px; display: none;"></div>
    <script>
      window.addEventListener('error', function(event) {
        var el = document.getElementById('error-container');
        el.style.display = 'block';
        el.innerHTML += '<p>' + event.message + ' at ' + event.filename + ':' + event.lineno + '</p>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        var el = document.getElementById('error-container');
        el.style.display = 'block';
        el.innerHTML += '<p>Promise Rejection: ' + event.reason + '</p>';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
