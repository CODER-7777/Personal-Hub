name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger workflow on tags matching v*, e.g., v1.0.0

permissions:
  contents: write # Needed to create a GitHub Release

jobs:
  build-desktop:
    name: Build Desktop on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Electron Dependencies
        run: npm install --legacy-peer-deps
        working-directory: electron

      - name: Install Linux Dependencies (Ubuntu Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - name: Build Windows App
        if: matrix.os == 'windows-latest'
        run: npm run build:windows

      - name: Build Linux App
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:linux

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Root Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web & Sync to Android
        run: npm run build:android

      - name: Build APK with Gradle
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
